<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F1">
<title>Qromfort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  font-family:var(--sans);

  /* Patient side: mist, slate, and one warm thing (the blanket) */
  --bg:#EDF1F1;
  --ink:#1E2B33;
  --ink-soft:#566872;
  --line:#D3DCDD;
  --tide:#36757A;
  --press:rgba(54,117,122,.09);
  --wool:#EADFCF;
  --wool-edge:#CDB48D;
  --honey:#98662B;
  --weave:rgba(120,88,40,.05);
  --sage-bg:#DDEBE3;
  --sage:#2F7352;
  --sage-edge:#A9CDB9;
  --rose:#A8453D;
  --rose-bg:#F6E4E1;
  --focus:#2A5FA0;

  /* Staff board: a monitor stays dark in any theme */
  --m-bg:#0C1114;
  --m-panel:#172027;
  --m-tile:#131B20;
  --m-line:#222E35;
  --m-idle:#64747C;
  --m-dim:#93A3AB;
  --m-text:#E4EBED;
  --m-new:#6FC7D6;
  --m-wait:#E8B84F;
  --m-over:#C23F36;
  --m-ack:#62CD94;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10181C; --ink:#E4EBED; --ink-soft:#9DADB5; --line:#27353C;
    --tide:#86C5C9; --press:rgba(134,197,201,.10);
    --wool:#2A251D; --wool-edge:#5B4B33; --honey:#E0B070; --weave:rgba(255,235,200,.035);
    --sage-bg:#162B24; --sage:#7FD3A6; --sage-edge:#2F5846;
    --rose:#F0A19A; --rose-bg:#2F1B1D; --focus:#8DB8F0;
  }
}
:root[data-theme="dark"]{
  --bg:#10181C; --ink:#E4EBED; --ink-soft:#9DADB5; --line:#27353C;
  --tide:#86C5C9; --press:rgba(134,197,201,.10);
  --wool:#2A251D; --wool-edge:#5B4B33; --honey:#E0B070; --weave:rgba(255,235,200,.035);
  --sage-bg:#162B24; --sage:#7FD3A6; --sage-edge:#2F5846;
  --rose:#F0A19A; --rose-bg:#2F1B1D; --focus:#8DB8F0;
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
body.is-board{background:var(--m-bg);color:var(--m-text)}
[hidden]{display:none!important}
button,select,input{font:inherit}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Prototype bar (scaffolding, not part of the product) ---------- */
.demo{background:#0A1013;color:#C9D4D8;padding:.5rem .75rem;display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:center;font-size:.875rem;border-bottom:1px solid #1E2A30}
.demo-tag{font-weight:700}
.seg{display:inline-flex;border:1px solid #33444C;border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#C9D4D8;border:0;padding:.5rem .875rem;min-height:40px}
.seg button[aria-pressed="true"]{background:#E4EBED;color:#10181C;font-weight:700}
.demo label{display:inline-flex;align-items:center;gap:.4rem}
.demo select,.demo .ghost{background:#131B20;color:#E4EBED;border:1px solid #33444C;border-radius:.5rem;padding:.4rem .6rem;min-height:40px}
.demo :focus-visible{outline:3px solid #8DB8F0;outline-offset:2px}

/* ---------- Patient page ---------- */
.patient{max-width:28rem;margin:0 auto;padding:1rem 1.25rem 3rem}
.lang{display:flex;flex-wrap:wrap;gap:0 1.25rem;margin:0 0 1.75rem}
.lang button{background:none;border:0;border-radius:.25rem;padding:0;min-height:44px;display:inline-flex;align-items:center;color:var(--ink-soft);font-size:.9375rem}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--tide);text-decoration-thickness:2px;text-underline-offset:.45em}
.where{margin:0 0 .4rem;color:var(--ink-soft)}
.patient h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.75rem,7.4vw,2.125rem);line-height:1.2;margin:0 0 1.25rem;text-wrap:balance}
.emergency{margin:0 0 1.75rem;padding-left:.875rem;border-left:2px solid var(--rose);color:var(--ink-soft);font-size:.9375rem;line-height:1.45}
.emergency strong{color:var(--rose)}
.fail{margin:0 0 1.25rem;padding:.75rem .875rem;border-radius:.75rem;background:var(--rose-bg);color:var(--ink);font-weight:700}
.seen{margin:0 0 .75rem}
.seen h2{font-size:1rem;margin:0}
.seen p{margin:.15rem 0 0;color:var(--ink-soft);font-size:.9375rem}

.choice{appearance:none;display:flex;align-items:center;gap:1rem;width:100%;min-height:4rem;margin:0;padding:.75rem .5rem;background:none;border:0;border-radius:.75rem;color:var(--ink);font-size:1.0625rem;line-height:1.3;text-align:left}
.choice svg{width:1.6rem;height:1.6rem;flex:none;color:var(--tide);stroke-width:1.5}
.choice:active{background:var(--press)}
@media (hover:hover){.choice:hover{background:var(--press)}}
.choice.is-busy{opacity:.6}
.choice--blanket{min-height:5.25rem;margin:0 0 1.25rem;padding:1rem 1.25rem;border-radius:1.125rem;background-color:var(--wool);background-image:repeating-linear-gradient(90deg,var(--weave) 0 1px,transparent 1px 6px);box-shadow:inset 0 0 0 1px var(--wool-edge);font-family:var(--serif);font-size:1.3125rem;line-height:1.25}
.choice--blanket svg{width:2.1rem;height:2.1rem;color:var(--honey);stroke-width:1.4}
.choice--blanket:active,.choice--blanket:hover{background-color:var(--wool)}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}

.asked-list{list-style:none;margin:0 0 1.25rem;padding:0;display:grid;gap:.75rem}
.asked{display:flex;align-items:flex-start;gap:1rem;padding:1rem 1.25rem;border-radius:1.125rem;background:var(--wool);box-shadow:inset 0 0 0 1px var(--wool-edge)}
.asked.is-ack{background:var(--sage-bg);box-shadow:inset 0 0 0 1px var(--sage-edge)}
.asked>svg{width:1.8rem;height:1.8rem;flex:none;margin-top:.1rem;color:var(--honey);stroke-width:1.5}
.asked.is-ack>svg{color:var(--sage)}
.asked .body{display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:0}
.asked .lbl{font-weight:700}
.status{display:flex;align-items:flex-start;gap:.5rem;font-size:.9375rem;color:var(--ink-soft)}
.status i{width:.5rem;height:.5rem;border-radius:50%;background:var(--honey);flex:none;margin-top:.5rem}
.status .tick{width:1rem;height:1rem;flex:none;margin-top:.25rem}
.is-ack .status{color:var(--sage);font-weight:700}
.note{color:var(--ink-soft);font-size:.9375rem}
.cancel{background:none;border:0;padding:.5rem 0;min-height:44px;align-self:flex-start;color:var(--ink);font-size:.9375rem;text-align:left;text-decoration:underline;text-underline-offset:.2em}
.asked.settle{animation:settle .45s ease-out}
@keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.foot{margin-top:2.5rem;color:var(--ink-soft);font-size:.875rem}
.foot p{margin:0}
.foot .mark{display:inline-flex;align-items:center;gap:.5rem;margin-bottom:.4rem;color:var(--ink);font-weight:700}
.foot .mark svg{width:1.25rem;height:1.25rem;color:var(--tide)}
.landing{display:flex;flex-direction:column;gap:1.25rem;padding-top:16vh}
.landing svg{width:3rem;height:3rem;color:var(--tide)}
.landing h1{margin:0}
.patient :focus-visible,.patient [tabindex="-1"]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ---------- Staff board ---------- */
.board{max-width:76rem;margin:0 auto;padding:1.25rem 1.25rem 6rem}
.b-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.25rem 1.25rem;margin-bottom:.25rem}
.b-head h1{font-size:1.125rem;margin:0;display:inline-flex;align-items:center;gap:.5rem}
.b-head h1 svg{width:1.4rem;height:1.4rem;color:var(--m-new)}
.b-sum{margin:0;color:var(--m-dim);font-variant-numeric:tabular-nums}
.area{font-size:.9375rem;font-weight:700;color:var(--m-dim);margin:1.5rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.25rem,1fr));grid-auto-rows:1fr;gap:.5rem}
.tile{appearance:none;background:var(--m-tile);color:var(--m-idle);border:1.5px solid var(--m-tile);border-radius:.625rem;min-height:6rem;padding:.55rem .6rem;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-width:0}
.tile:disabled{cursor:default}
.tile .n{font-size:2.125rem;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.tile .what{font-size:.8125rem;line-height:1.15;color:var(--m-text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .t{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;min-height:1.2em}
.tile[data-level]{color:var(--c);border-color:var(--c);background:var(--tint)}
.tile[data-level="new"]{--c:var(--m-new);--tint:#112529}
.tile[data-level="wait"]{--c:var(--m-wait);--tint:#2A2310}
.tile[data-level="ack"]{--c:var(--m-ack);--tint:#112A1E}
.tile[data-level="over"]{--c:#fff;--tint:var(--m-over);border-color:var(--m-over);animation:breathe 2.6s ease-in-out infinite}
.tile[data-level="over"] .what{color:#fff;font-weight:700}
.tile[aria-expanded="true"]{outline:2px solid var(--m-text);outline-offset:2px}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.78}}
@media (max-width:32rem){
  .grid{grid-template-columns:repeat(4,1fr);gap:.375rem}
  .tile{min-height:5.25rem;padding:.4rem}
  .tile .n{font-size:1.5rem}
  .tile .what{font-size:.75rem}
  .tile .t{font-size:.875rem}
}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;margin:1.25rem 0 0;padding:0;list-style:none;color:var(--m-dim);font-size:.875rem}
.legend li{display:inline-flex;align-items:center;gap:.45rem}
.legend i{width:.85rem;height:.85rem;border-radius:3px;border:2px solid var(--c);display:inline-block}
.legend .fill{background:var(--c)}
.board :focus-visible{outline:3px solid var(--m-text);outline-offset:2px}

.gate{max-width:22rem;margin:3rem auto}
.gate label{display:block;font-weight:700;margin-bottom:.5rem}
.gate input{width:100%;font-size:1.5rem;letter-spacing:.2em;padding:.6rem .75rem;background:var(--m-tile);color:var(--m-text);border:1.5px solid #33444C;border-radius:.625rem}
.gate button{margin-top:.75rem;width:100%;min-height:48px;border:0;border-radius:.625rem;background:var(--m-text);color:#0C1114;font-weight:700}
.gate p{color:#F0A19A;min-height:1.5em;margin:.75rem 0 0}
.setup{max-width:34rem;margin:2rem auto;border:1.5px solid var(--m-wait);border-radius:.625rem;padding:1rem}
.offline{background:var(--m-over);color:#fff;font-weight:700;padding:.6rem .8rem;border-radius:.5rem;margin:.75rem 0}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--m-panel);color:var(--m-text);border-top:2px solid var(--c,var(--m-line));border-radius:1.25rem 1.25rem 0 0;padding:1.1rem 1.25rem calc(1.1rem + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto;box-shadow:0 -12px 32px rgba(0,0,0,.4)}
.sheet-in{max-width:40rem;margin:0 auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.5rem}
.sheet h2{font-size:1.5rem;margin:0}
.sheet h2:focus{outline:none}
.x{background:transparent;color:var(--m-text);border:1.5px solid #33444C;border-radius:.5rem;padding:.4rem .875rem;min-height:44px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1rem;padding:.75rem 0;border-top:1px solid var(--m-line)}
.row-what{display:flex;flex-direction:column}
.row-what strong{font-size:1.0625rem}
.row-what span{color:var(--m-dim);font-size:.9375rem;font-variant-numeric:tabular-nums}
.row-acts{display:flex;gap:.5rem}
.row-acts button{min-height:48px;padding:.5rem 1rem;border-radius:.5rem;font-weight:700;border:1.5px solid #4A5A62;background:transparent;color:var(--m-text)}
.row-acts .go{background:var(--m-ack);border-color:var(--m-ack);color:#07271A}
.sheet :focus-visible{outline:3px solid var(--m-text);outline-offset:2px}
</style>
</head>
<body>

<div class="demo" id="demo" hidden>
  <span class="demo-tag">Prototype</span>
  <div class="seg" role="group" aria-label="Which screen to show">
    <button type="button" id="seg-patient" aria-pressed="true">Patient phone</button>
    <button type="button" id="seg-board" aria-pressed="false">Staff board</button>
  </div>
  <label id="room-pick">Scanned code
    <select id="room-select"></select>
  </label>
  <button type="button" class="ghost" id="seed" hidden>Add sample requests</button>
  <button type="button" class="ghost" id="clear" hidden>Clear all</button>
</div>

<p id="live" class="sr-only" aria-live="polite"></p>

<main class="patient" id="patient"></main>

<main class="board" id="board" hidden>
  <div class="b-head">
    <h1>
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="3" y="3" width="19" height="19" rx="5" stroke="currentColor" stroke-width="3"/><rect x="9.5" y="9.5" width="6" height="6" rx="1" fill="currentColor"/><path d="M19 19l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      Qromfort board
    </h1>
    <p class="b-sum" id="b-sum"></p>
  </div>
  <div class="gate" id="gate" hidden>
    <form id="pin-form">
      <label for="pin">Staff PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
      <button type="submit">Open the board</button>
      <p id="pin-msg" role="alert"></p>
    </form>
  </div>
  <p class="setup" id="setup" hidden></p>
  <p class="offline" id="offline" role="alert" hidden>Not connected. Requests may be missing. Retrying.</p>
  <div id="board-body">
  <div id="areas"></div>
  <ul class="legend" aria-label="What the colors mean">
    <li style="--c:var(--m-new)"><i></i>New, under 5 min</li>
    <li style="--c:var(--m-wait)"><i></i>5 to 10 min, or bathroom help</li>
    <li style="--c:var(--m-over)"><i class="fill"></i>! Over 10 min</li>
    <li style="--c:var(--m-ack)"><i></i>✓ Someone is on the way</li>
  </ul>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-top">
        <h2 id="sheet-title" tabindex="-1"></h2>
        <button type="button" class="x" id="sheet-close">Close</button>
      </div>
      <div id="sheet-rows"></div>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG — edit these for the real unit (and keep api/requests.js in step)
   ===================================================================== */
// Every place a QR code can live. `id` is what goes in the QR link (?room=ID).
var AREAS = [
  { kind:'bed',    title:'Beds',                spots:[] },
  { kind:'chair',  title:'Waiting room chairs', spots:[] },
  { kind:'triage', title:'Triage',              spots:[] }
];
(function(){
  for (var i = 1; i <= 50; i++) {
    if (i === 42 || i === 43) {
      AREAS[0].spots.push({ id:i + 'A', num:i + 'A' }, { id:i + 'B', num:i + 'B' });
    } else {
      AREAS[0].spots.push({ id:String(i), num:String(i) });
    }
  }
  for (var c = 1; c <= 5; c++) AREAS[1].spots.push({ id:'C' + c, num:String(c) });
  for (var t = 1; t <= 2; t++) AREAS[2].spots.push({ id:'T' + t, num:String(t) });
})();
var ROOMS = [], SPOT = {};
var STAFF_KIND = { bed:'Room', chair:'Chair', triage:'Triage' };
AREAS.forEach(function(a){
  a.spots.forEach(function(sp){
    sp.kind = a.kind;
    sp.staff = STAFF_KIND[a.kind] + ' ' + sp.num;   // what staff see: "Room 42A", "Chair 3"
    ROOMS.push(sp.id);
    SPOT[sp.id] = sp;
  });
});

var WAIT_AFTER = 5 * 60 * 1000;       // cyan -> yellow
var OVER_AFTER = 10 * 60 * 1000;      // yellow -> red
var POLL_BOARD = 10 * 1000;           // how often the board checks for requests
var POLL_PATIENT = 15 * 1000;         // how often a phone checks on its own request

// `floor` is the lowest alarm level a request can start at (0 new, 1 waiting).
var REQUESTS = [
  { id:'blanket',  staff:'Warm blanket',             floor:0 },
  { id:'pillow',   staff:'Pillow',                   floor:0 },
  { id:'water',    staff:'Water or ice (check NPO)', short:'Water/ice, NPO?', floor:0 },
  { id:'lights',   staff:'Lights dimmed',            floor:0, notFor:['chair'] },
  { id:'charger',  staff:'Phone charger',            floor:0 },
  { id:'bathroom', staff:'Bathroom help',            floor:1 },
  { id:'other',    staff:'Stop by',                  floor:0 }
];
var REQ = {};
REQUESTS.forEach(function(r){ REQ[r.id] = r; });

/* =====================================================================
   MODE — the QR code decides the room.
   Real use:  /?room=12  /?room=42A  /?room=C3  /?room=T1  (patient)   /?view=board  (staff)
   Prototype: /?demo  (this device only, nothing is sent)
   ===================================================================== */
var params = new URLSearchParams(location.search);
var qRoom = params.get('room');
var qView = params.get('view');
var onSite = /(^|\.)qromfort\.com$/i.test(location.hostname);
var demo = params.has('demo') || (!qRoom && qView !== 'board' && !onSite);
var view = qView === 'board' ? 'board' : 'patient';
var room = ROOMS.indexOf(qRoom) > -1 ? qRoom : (demo ? '12' : null);

function readJSON(key, fallback){
  try { var v = JSON.parse(localStorage.getItem(key)); return v && typeof v === 'object' ? v : fallback; }
  catch (e) { return fallback; }
}
function writeJSON(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
function valid(r){ return r && REQ[r.type] && SPOT[r.room]; }

/* =====================================================================
   STORES — same shape, two homes.
   localStore:  prototype only, this browser.
   remoteStore: the real thing, talks to /api/requests.
   ===================================================================== */
function localStore(){
  var KEY = 'qromfort.requests.v1';
  var mem = [], subs = [];
  function load(){
    var v = readJSON(KEY, []);
    var cutoff = Date.now() - 6 * 60 * 60 * 1000;
    mem = (Array.isArray(v) ? v : []).filter(function(r){ return valid(r) && r.createdAt > cutoff; });
  }
  function save(next){ mem = next; writeJSON(KEY, mem); notify(); }
  function notify(){ subs.forEach(function(fn){ fn(); }); }
  try {
    window.addEventListener('storage', function(e){
      if (e.key === KEY || e.key === null) { load(); notify(); }
    });
  } catch (e) {}
  load();
  function put(room, type, createdAt, ackAt){
    var found = mem.filter(function(r){ return r.room === room && r.type === type; })[0];
    if (found) return found;
    var rec = { id:room + ':' + type, room:room, type:type, createdAt:createdAt || Date.now(), ackAt:ackAt || null };
    save(mem.concat([rec]));
    return rec;
  }
  return {
    state:'ok', setupError:null,
    now: function(){ return Date.now(); },
    list: function(){ return mem.slice(); },
    start: function(){ return Promise.resolve(); },
    canCancel: function(){ return true; },
    seed: put,
    add: function(room, type){ return Promise.resolve(put(room, type)); },
    ack: function(id){
      save(mem.map(function(r){ return r.id === id ? Object.assign({}, r, { ackAt: Date.now() }) : r; }));
      return Promise.resolve();
    },
    close: function(id){ save(mem.filter(function(r){ return r.id !== id; })); return Promise.resolve(); },
    clear: function(){ save([]); },
    unlock: function(){ return Promise.resolve('ok'); },
    subscribe: function(fn){ subs.push(fn); }
  };
}

function remoteStore(){
  var mem = [], subs = [], skew = 0, timer = null, scope = null;
  var tokens = readJSON('qromfort.tokens', {});     // lets this phone cancel what it asked for
  var session = null;
  try { session = localStorage.getItem('qromfort.session'); } catch (e) {}
  var api = { state:'loading', setupError:null };

  function notify(){ subs.forEach(function(fn){ fn(); }); }
  function isBoard(){ return scope && !scope.room; }
  function call(method, query, body){
    var headers = {};
    if (body) headers['Content-Type'] = 'application/json';
    if (session) headers['X-Board-Session'] = session;
    return fetch('/api/requests' + (query || ''), {
      method:method, headers:headers, body: body ? JSON.stringify(body) : undefined, cache:'no-store'
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { status:r.status, data:d || {} }; });
    });
  }
  function take(data){
    if (typeof data.now === 'number') skew = data.now - Date.now();
    if (Array.isArray(data.requests)) mem = data.requests.filter(valid);
  }
  function lock(){
    session = null;
    try { localStorage.removeItem('qromfort.session'); } catch (e) {}
    api.state = 'locked';
  }
  function settle(res){
    if (res.status === 200) { take(res.data); api.state = 'ok'; return true; }
    if (res.status === 401) lock();
    else if (res.status === 503 && res.data.error) { api.state = 'setup'; api.setupError = res.data.error; }
    else api.state = 'offline';
    return false;
  }
  function refresh(){
    if (!scope) return Promise.resolve();
    var q = scope.room ? '?room=' + encodeURIComponent(scope.room) : '';
    return call('GET', q).then(function(res){
      if (settle(res) && scope.room) {
        // forget cancel tokens for requests that are gone
        var live = {}, changed = false;
        mem.forEach(function(r){ live[r.id] = true; });
        Object.keys(tokens).forEach(function(id){
          if (id.indexOf(scope.room + ':') === 0 && !live[id]) { delete tokens[id]; changed = true; }
        });
        if (changed) writeJSON('qromfort.tokens', tokens);
      }
    }, function(){ api.state = 'offline'; }).then(function(){ notify(); schedule(); });
  }
  function schedule(){
    clearTimeout(timer);
    if (!scope || document.hidden || api.state === 'locked') return;
    if (scope.room && api.state === 'ok' && !mem.length) return;      // nothing to watch
    var wait = scope.room ? POLL_PATIENT : POLL_BOARD;
    if (api.state === 'setup') wait = 30 * 1000;
    timer = setTimeout(refresh, wait);
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && scope && api.state !== 'locked') refresh();
    else clearTimeout(timer);
  });

  api.now = function(){ return Date.now() + skew; };
  api.list = function(){ return mem.slice(); };
  api.subscribe = function(fn){ subs.push(fn); };
  api.canCancel = function(r){ return isBoard() || !!tokens[r.id]; };
  api.start = function(sc){
    scope = sc;
    if (isBoard() && !session) { api.state = 'locked'; notify(); return Promise.resolve(); }
    return refresh();
  };
  api.add = function(room, type){
    return call('POST', '', { room:room, type:type }).then(function(res){
      if (res.status !== 200 || !res.data.request) throw new Error(res.data.error || 'not_sent');
      var rec = res.data.request;
      if (typeof res.data.now === 'number') skew = res.data.now - Date.now();
      if (res.data.token) { tokens[rec.id] = res.data.token; writeJSON('qromfort.tokens', tokens); }
      mem = mem.filter(function(r){ return r.id !== rec.id; }).concat([rec]);
      api.state = 'ok';
      notify(); schedule();
      return rec;
    });
  };
  api.close = function(id){
    var body = isBoard() ? { action:'done', id:id } : { action:'cancel', id:id, token:tokens[id] };
    return call('POST', '', body).then(function(res){
      if (res.status === 200) {
        if (tokens[id]) { delete tokens[id]; writeJSON('qromfort.tokens', tokens); }
        if (Array.isArray(res.data.requests)) take(res.data);
        else mem = mem.filter(function(r){ return r.id !== id; });
        api.state = 'ok';
      } else settle(res);
    }, function(){ api.state = 'offline'; }).then(function(){ notify(); schedule(); });
  };
  api.ack = function(id){
    return call('POST', '', { action:'ack', id:id }).then(settle, function(){ api.state = 'offline'; })
      .then(function(){ notify(); schedule(); });
  };
  api.unlock = function(pin){
    return call('POST', '', { action:'unlock', pin:pin }).then(function(res){
      if (res.status === 200 && res.data.session) {
        session = res.data.session;
        try { localStorage.setItem('qromfort.session', session); } catch (e) {}
        return refresh().then(function(){ return 'ok'; });
      }
      if (res.status === 503 && res.data.error) { api.state = 'setup'; api.setupError = res.data.error; notify(); schedule(); return 'setup'; }
      if (res.status === 429) return 'too_many';
      if (res.status === 401) return 'wrong';
      return 'offline';
    }, function(){ return 'offline'; });
  };
  return api;
}

function clock(ts){
  try { return new Date(ts).toLocaleTimeString(LOCALE[lang], { hour:'numeric', minute:'2-digit' }); }
  catch (e) { return new Date(ts).toLocaleTimeString(); }
}
function elapsed(ms){
  var s = Math.max(0, Math.floor(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  var mm = h ? String(m).padStart(2,'0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(sec).padStart(2,'0');
}

var pending = {};        // request types this phone is sending right now
var sendFailed = false;
var lastPatientHtml = null;

function focusKeyNow(){
  var a = document.activeElement;
  if (!a || !elPatient.contains(a)) return null;
  var card = a.closest('[data-card]');
  return a.dataset.ask || (card && card.dataset.card) || (a.dataset.lang ? 'lang:' + a.dataset.lang : null);
}

function renderPatient(focusType){
  var t = T[lang];
  document.documentElement.lang = lang;

  var langs =
    '<div class="lang" role="group" aria-label="Language">' +
      LANGS.map(function(l){
        return '<button type="button" data-lang="' + l[0] + '" lang="' + l[0] + '" aria-pressed="' + (l[0] === lang) + '">' + l[1] + '</button>';
      }).join('') +
    '</div>';

  var html;
  if (!room) {
    html = langs + '<div class="landing">' + ICON.mark + '<h1>' + t.scan + '</h1></div>';
  } else {
    var spot = SPOT[room];
    var mine = {};
    store.list().forEach(function(r){ if (r.room === room) mine[r.type] = r; });
    var any = Object.keys(mine).length > 0;

    var offered = REQUESTS.filter(function(d){ return !d.notFor || d.notFor.indexOf(spot.kind) < 0; });
    var asked = REQUESTS.filter(function(d){ return mine[d.id]; })
      .sort(function(a,b){ return mine[a.id].createdAt - mine[b.id].createdAt; });
    var open = offered.filter(function(d){ return !mine[d.id]; });
    var blanketOpen = open.filter(function(d){ return d.id === 'blanket'; })[0];
    var others = open.filter(function(d){ return d.id !== 'blanket'; });

    var choice = function(def, extra){
      var busy = !!pending[def.id];
      return '<button type="button" class="choice' + (extra || '') + (busy ? ' is-busy' : '') + '" data-ask="' + def.id + '"' + (busy ? ' aria-disabled="true"' : '') + '>' +
        ICON[def.id] + '<span>' + (busy ? t.sending : t[def.id]) + '</span></button>';
    };

    var askedHtml = asked.map(function(def){
      var r = mine[def.id];
      var acked = !!r.ackAt;
      return '<li><div class="asked' + (acked ? ' is-ack' : ' is-open') + '" data-card="' + def.id + '" tabindex="-1">' +
        ICON[def.id] +
        '<div class="body">' +
          '<span class="lbl">' + t[def.id] + '</span>' +
          '<span class="status">' + (acked ? ICON.check + '<span>' + t.ack + '</span>' : '<i aria-hidden="true"></i><span>' + t.open.replace('{t}', clock(r.createdAt)) + '</span>') + '</span>' +
          (def.id === 'water' ? '<span class="note">' + t.waterNote + '</span>' : '') +
          (store.canCancel(r) ? '<button type="button" class="cancel" data-cancel="' + r.id + '">' + t.cancel + '</button>' : '') +
        '</div></div></li>';
    }).join('');

    html = langs +
      '<p class="where">' + t.kind[spot.kind] + ' ' + spot.num + '</p>' +
      '<h1>' + t.q + '</h1>' +
      '<p class="emergency"><strong>' + t.emLead + '</strong> ' + (spot.kind === 'bed' ? t.em : t.emNoBell) + '</p>' +
      (sendFailed ? '<p class="fail" role="alert">' + t.fail + '</p>' : '') +
      (any ? '<div class="seen"><h2>' + t.seen + '</h2><p>' + t.first + '</p></div><ul class="asked-list">' + askedHtml + '</ul>' : '') +
      (blanketOpen ? choice(blanketOpen, ' choice--blanket') : '') +
      (others.length ? '<ul class="list">' + others.map(function(d){ return '<li>' + choice(d) + '</li>'; }).join('') + '</ul>' : '') +
      '<footer class="foot"><span class="mark">' + ICON.mark + 'Qromfort</span><p>' + t.fine + '</p></footer>';
  }

  if (html === lastPatientHtml && !focusType) return;      // nothing changed: leave the page (and focus) alone
  var key = focusType || focusKeyNow();
  elPatient.innerHTML = html;
  lastPatientHtml = html;

  if (key) {
    var el = key.indexOf('lang:') === 0
      ? elPatient.querySelector('[data-lang="' + key.slice(5) + '"]')
      : (elPatient.querySelector('[data-card="' + key + '"]') || elPatient.querySelector('[data-ask="' + key + '"]'));
    if (el) el.focus();
  }
}

elPatient.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) {
    lang = b.dataset.lang;
    try { localStorage.setItem('qromfort.lang', lang); } catch (err) {}
    renderPatient('lang:' + lang);
  } else if (b.dataset.ask) {
    var type = b.dataset.ask;
    if (pending[type]) return;
    pending[type] = true;
    sendFailed = false;
    renderPatient(type);
    store.add(room, type).then(function(){
      delete pending[type];
      renderPatient(type);
      var card = elPatient.querySelector('[data-card="' + type + '"]');
      if (card) card.classList.add('settle');
      elLive.textContent = T[lang].sentLive + ' ' + T[lang][type];
    }, function(){
      delete pending[type];
      sendFailed = true;                 // never pretend it went through
      renderPatient(type);
    });
  } else if (b.dataset.cancel) {
    var card = b.closest('[data-card]');
    var typeBack = card ? card.dataset.card : null;
    store.close(b.dataset.cancel).then(function(){ renderPatient(typeBack); });
  }
});

var LEVELS = ['ack','new','wait','over'];        // index = urgency rank
function rankOf(r, now){
  if (r.ackAt) return 0;
  var age = now - r.createdAt;
  var byAge = age >= OVER_AFTER ? 3 : (age >= WAIT_AFTER ? 2 : 1);
  return Math.max(byAge, REQ[r.type].floor + 1);
}
var STATE_WORD = { ack:'on the way', 'new':'new', wait:'waiting', over:'over 10 minutes' };
var GLYPH = { ack:'✓ ', 'new':'', wait:'', over:'! ' };
var SETUP_HELP = {
  no_database:'The database isn’t connected yet. In Vercel, open this project’s Storage tab, create an Upstash for Redis database, connect it to this project, then redeploy.',
  no_pin:'No staff PIN is set yet. In Vercel, open Settings, then Environment Variables, add BOARD_PIN, then redeploy.'
};

var tiles = {};
var openRoom = null;
var sheetSig = null;

function buildBoard(){
  var wrap = $('areas');
  AREAS.forEach(function(area){
    var h = document.createElement('h2');
    h.className = 'area';
    h.textContent = area.title;
    var grid = document.createElement('div');
    grid.className = 'grid';
    area.spots.forEach(function(sp){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile';
      b.disabled = true;
      b.dataset.room = sp.id;
      b.innerHTML = '<span class="n">' + sp.id + '</span><span class="what"></span><span class="t"></span>';
      grid.appendChild(b);
      tiles[sp.id] = { el:b, what:b.querySelector('.what'), t:b.querySelector('.t') };
    });
    wrap.appendChild(h);
    wrap.appendChild(grid);
  });
  wrap.addEventListener('click', function(e){
    var b = e.target.closest('.tile');
    if (b && !b.disabled) openSheet(b.dataset.room);
  });
}

function summarize(now){
  var byRoom = {};
  store.list().forEach(function(r){ (byRoom[r.room] = byRoom[r.room] || []).push(r); });
  var out = {};
  Object.keys(byRoom).forEach(function(rm){
    var list = byRoom[rm].slice().sort(function(a,b){
      return (rankOf(b, now) - rankOf(a, now)) || (a.createdAt - b.createdAt);
    });
    out[rm] = { list:list, top:list[0], level:LEVELS[rankOf(list[0], now)] };
  });
  return out;
}

function renderBoardState(){
  var st = store.state;
  var locked = st === 'locked', setup = st === 'setup';
  $('gate').hidden = !locked;
  $('setup').hidden = !setup;
  $('offline').hidden = st !== 'offline';
  $('board-body').hidden = locked || setup;
  if (setup) $('setup').textContent = SETUP_HELP[store.setupError] || 'The server isn’t set up yet.';
  if (locked || setup) closeSheet(true);
}

function tickBoard(){
  var now = store.now();
  var rooms = summarize(now);
  var waiting = 0, onWay = 0, longest = null;

  ROOMS.forEach(function(rm){
    var tile = tiles[rm], info = rooms[rm];
    if (!info) {
      if (!tile.el.disabled) {
        tile.el.disabled = true;
        tile.el.removeAttribute('data-level');
        tile.el.removeAttribute('aria-expanded');
        tile.what.textContent = '';
        tile.t.textContent = '';
      }
      tile.el.setAttribute('aria-label', SPOT[rm].staff + ', no requests');
      return;
    }
    info.list.forEach(function(r){
      if (r.ackAt) onWay++;
      else {
        waiting++;
        if (!longest || r.createdAt < longest.createdAt) longest = r;
      }
    });
    var more = info.list.length - 1;
    tile.el.disabled = false;
    tile.el.dataset.level = info.level;
    tile.el.setAttribute('aria-expanded', String(openRoom === rm));
    tile.what.textContent = (REQ[info.top.type].short || REQ[info.top.type].staff) + (more ? ' +' + more : '');
    tile.t.textContent = GLYPH[info.level] + elapsed(now - info.top.createdAt);
    tile.el.setAttribute('aria-label', SPOT[rm].staff + ', ' + REQ[info.top.type].staff + ', ' + STATE_WORD[info.level] + (more ? ', plus ' + more + ' more' : ''));
  });

  var sum = $('b-sum');
  if (store.state === 'loading') sum.textContent = 'Connecting…';
  else if (store.state === 'locked' || store.state === 'setup') sum.textContent = '';
  else if (!waiting && !onWay) sum.textContent = 'All rooms quiet.';
  else {
    var parts = [];
    if (waiting) parts.push(waiting + ' waiting');
    if (onWay) parts.push(onWay + ' on the way');
    sum.textContent = parts.join(', ') + (longest ? '. Longest wait: ' + SPOT[longest.room].staff + ', ' + elapsed(now - longest.createdAt) : '.');
  }

  if (openRoom) {
    var info2 = rooms[openRoom];
    if (!info2) { closeSheet(true); }
    else {
      $('sheet').style.setProperty('--c', 'var(--m-' + info2.level + ')');
      $('sheet-rows').querySelectorAll('[data-at]').forEach(function(s){
        s.textContent = elapsed(now - Number(s.dataset.at));
      });
    }
  }
}

function renderSheet(){
  if (!openRoom) return;
  var now = store.now();
  var info = summarize(now)[openRoom];
  if (!info) { closeSheet(true); return; }
  var sig = openRoom + '|' + info.list.map(function(r){ return r.id + (r.ackAt ? ':a' : ':o'); }).join('|');
  if (sig === sheetSig) return;                       // unchanged: keep focus where it is
  sheetSig = sig;
  $('sheet-title').textContent = SPOT[openRoom].staff;
  $('sheet-rows').innerHTML = info.list.map(function(r){
    var acked = !!r.ackAt;
    return '<div class="row">' +
      '<div class="row-what"><strong>' + REQ[r.type].staff + '</strong>' +
        '<span>' + (acked ? 'On the way. Asked ' : 'Waiting ') + '<span data-at="' + r.createdAt + '">' + elapsed(now - r.createdAt) + '</span>' + (acked ? ' ago' : '') + '</span></div>' +
      '<div class="row-acts">' +
        (acked ? '' : '<button type="button" class="go" data-act="ack" data-id="' + r.id + '">On my way</button>') +
        '<button type="button" data-act="done" data-id="' + r.id + '">Done</button>' +
      '</div></div>';
  }).join('');
}

function openSheet(rm){
  openRoom = rm;
  sheetSig = null;
  $('sheet').hidden = false;
  renderSheet();
  tickBoard();
  $('sheet-title').focus();
}
function closeSheet(silent){
  var was = openRoom;
  openRoom = null;
  sheetSig = null;
  $('sheet').hidden = true;
  if (was && tiles[was]) {
    tiles[was].el.removeAttribute('aria-expanded');
    if (!silent && !tiles[was].el.disabled) tiles[was].el.focus();
  }
}
$('sheet-close').addEventListener('click', function(){ closeSheet(false); });
$('sheet-rows').addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  b.disabled = true;
  var done = b.dataset.act === 'ack' ? store.ack(b.dataset.id) : store.close(b.dataset.id);
  done.then(function(){
    b.disabled = false;
    if (openRoom) $('sheet-title').focus();
  });
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && openRoom) closeSheet(false);
});

$('pin-form').addEventListener('submit', function(e){
  e.preventDefault();
  var input = $('pin'), msg = $('pin-msg');
  msg.textContent = '';
  store.unlock(input.value).then(function(result){
    input.value = '';
    if (result === 'wrong') msg.textContent = 'That PIN didn’t work.';
    else if (result === 'too_many') msg.textContent = 'Too many tries. Wait 10 minutes, then try again.';
    else if (result === 'offline') msg.textContent = 'Can’t reach the server. Check the connection, then try again.';
    if (result !== 'ok' && result !== 'setup') input.focus();
  });
});

/* =====================================================================
   VIEW SWITCHING + PROTOTYPE CONTROLS
   ===================================================================== */
function setChrome(){
  var m = document.querySelector('meta[name="theme-color"]');
  if (!m) return;
  var dark = false;
  try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  m.setAttribute('content', view === 'board' ? '#0C1114' : (dark ? '#10181C' : '#EDF1F1'));
}
function showView(next){
  view = next;
  setChrome();
  var isBoard = view === 'board';
  document.body.classList.toggle('is-board', isBoard);
  elPatient.hidden = isBoard;
  elBoard.hidden = !isBoard;
  $('seg-patient').setAttribute('aria-pressed', String(!isBoard));
  $('seg-board').setAttribute('aria-pressed', String(isBoard));
  $('room-pick').hidden = isBoard;
  $('seed').hidden = !isBoard;
  $('clear').hidden = !isBoard;
  if (isBoard) { document.documentElement.lang = 'en'; renderBoardState(); tickBoard(); }
  else { closeSheet(true); renderPatient(); }
}

function seedSamples(){
  var now = Date.now(), m = 60 * 1000;
  store.seed('3',  'pillow',   now - 40 * 1000);
  store.seed('7',  'blanket',  now - (6 * m + 12 * 1000));
  store.seed('15', 'bathroom', now - 1 * m);
  store.seed('18', 'water',    now - 11 * m);
  store.seed('18', 'blanket',  now - 3 * m);
  store.seed('21', 'blanket',  now - 4 * m, now - 2 * m);
  store.seed('42B','charger',  now - 2 * m);
  store.seed('C2', 'blanket',  now - 7 * m);
}

if (demo) {
  $('demo').hidden = false;
  var sel = $('room-select');
  ROOMS.forEach(function(rm){
    var o = document.createElement('option');
    o.value = rm; o.textContent = SPOT[rm].staff;
    if (rm === room) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function(){ room = sel.value; renderPatient(); });
  $('seg-patient').addEventListener('click', function(){ showView('patient'); });
  $('seg-board').addEventListener('click', function(){ showView('board'); });
  $('seed').addEventListener('click', seedSamples);
  $('clear').addEventListener('click', function(){ store.clear(); });
}

var ackSeen = {};
store.subscribe(function(){
  if (view === 'board') { renderBoardState(); renderSheet(); tickBoard(); }
  else {
    // announce "on the way" once when the team picks up this room's request
    var newlyAcked = false;
    store.list().forEach(function(r){
      if (r.room === room && r.ackAt && !ackSeen[r.id]) { ackSeen[r.id] = true; newlyAcked = true; }
    });
    renderPatient();
    if (newlyAcked) elLive.textContent = T[lang].ackLive;
  }
});

buildBoard();
showView(view);
if (!demo) {
  if (view === 'board') store.start({ board:true });
  else if (room) store.start({ room:room });
}
setInterval(function(){ if (view === 'board') tickBoard(); }, 1000);

})();
</script>
</body>
</html>
